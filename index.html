function confetti(){const cf=$('cf'),cols=['#fbbf24','#ef4444','#3b82f6','#a855f7','#10b981','#fff'];let h='';for(let i=0;i<46;i++)h+=`<i style="left:${Math.random()*100}%;background:${cols[i%6]};animation-duration:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*.5}s"></i>`;cf.innerHTML=h;setTimeout(()=>cf.innerHTML='',4200)}
function winPop(w){confetti();$('popAmt').textContent=money(w);$('pop').classList.add('on');[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,.07),i*120));clearTimeout(popT);popT=setTimeout(()=>$('pop').classList.remove('on'),3500)}
$('btnBets').onclick=()=>{renderTable();$('betPop').classList.add('on')};
$('betClose').onclick=()=>$('betPop').classList.remove('on');
$('betPop').onclick=e=>{if(e.target.id==='betPop')$('betPop').classList.remove('on')};
$('popOk').onclick=()=>$('pop').classList.remove('on');
$('btnSound').onclick=()=>{S.sound=!S.sound;$('iconOn').style.display=S.sound?'':'none';$('iconOff').style.display=S.sound?'none':''};

/* wheel */
function shade(h,amt){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,v+amt));return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'}
function star(x,cx,cy,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)}x.closePath()}
function draw(t){
  t=t||performance.now();
  const c=$('cv'),x=c.getContext('2d'),W=680,R=W/2,n=S.layout.length||40,st=2*Math.PI/n,rim=30,rr=R-4,wr=rr-rim-4;
  x.setTransform(c.width/680,0,0,c.width/680,0,0);x.clearRect(0,0,W,W);
  let g=x.createRadialGradient(R,R,rr-rim,R,R,rr);g.addColorStop(0,'#141b2d');g.addColorStop(.5,'#1c263f');g.addColorStop(1,'#07090e');
  x.beginPath();x.arc(R,R,rr,0,7);x.fillStyle=g;x.fill();x.lineWidth=4;x.strokeStyle='#f59e0b';x.stroke();
  for(let i=0;i<32;i++){const a=i/32*2*Math.PI-Math.PI/2,bx=R+Math.cos(a)*(rr-rim/2+1),by=R+Math.sin(a)*(rr-rim/2+1),on=(Math.floor(t/280)+i)%2===0;
    const bg=x.createRadialGradient(bx-1.5,by-1.5,1,bx,by,7);
    if(on){bg.addColorStop(0,'#fff');bg.addColorStop(.4,'#fbbf24');bg.addColorStop(1,'#f59e0b');x.shadowColor='#ffd24a';x.shadowBlur=10}else{bg.addColorStop(0,'#a37a3a');bg.addColorStop(1,'#4b2c0a');x.shadowBlur=0}
    x.beginPath();x.arc(bx,by,6,0,7);x.fillStyle=bg;x.fill();x.shadowBlur=0}
  x.save();x.translate(R,R);x.rotate(S.rot);
  for(let i=0;i<n;i++){const id=S.layout[i],base=colorOf(id),a0=-Math.PI/2+i*st,a1=a0+st;
    const rg=x.createRadialGradient(0,0,wr*.2,0,0,wr);rg.addColorStop(0,shade(base,-40));rg.addColorStop(.6,base);rg.addColorStop(1,shade(base,30));
    x.beginPath();x.moveTo(0,0);x.arc(0,0,wr,a0,a1);x.closePath();x.fillStyle=rg;x.fill();x.strokeStyle='rgba(12,6,14,.92)';x.lineWidth=2.5;x.stroke();
    x.beginPath();x.arc(0,0,wr-5,a0+.02,a1-.02);x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=2;x.stroke();
    x.save();x.rotate(i*st+st/2);x.textAlign='center';x.textBaseline='middle';const ly=-(wr-50);
    if(id==='mega'){star(x,0,ly+2,17);x.fillStyle='#fff';x.fill();x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.6)';x.stroke();x.font='900 13px sans-serif';x.lineWidth=4;x.strokeText('MEGA',0,ly+30);x.fillText('MEGA',0,ly+30)}
    else{x.font='900 30px sans-serif';x.lineWidth=6;x.strokeStyle='rgba(0,0,0,.6)';x.strokeText(labelOf(id),0,ly);x.fillStyle='#fff';x.fillText(labelOf(id),0,ly)}
    x.restore();
    if(S.winSeg===i){x.beginPath();x.moveTo(0,0);x.arc(0,0,wr,a0,a1);x.closePath();x.fillStyle='rgba(255,255,255,'+(.3+.3*Math.sin(t/110))+')';x.fill()}}
  x.restore();
  const g2=x.createRadialGradient(R,R,wr*.1,R,R,wr*.36);g2.addColorStop(0,'#2f64e8');g2.addColorStop(1,'#0a1c66');
  x.beginPath();x.arc(R,R,wr*.35,0,7);x.fillStyle=g2;x.fill();x.lineWidth=7;x.strokeStyle='#f59e0b';x.stroke();
  const gl=x.createLinearGradient(0,R*.15,0,R*1.05);gl.addColorStop(0,'rgba(255,255,255,.2)');gl.addColorStop(.55,'rgba(255,255,255,.03)');gl.addColorStop(1,'rgba(255,255,255,0)');
  x.beginPath();x.ellipse(R,R*.66,wr*.8,wr*.52,0,0,7);x.fillStyle=gl;x.fill();
}
let lastDraw=0;(function loop(t){if(t-lastDraw>33){lastDraw=t;draw(t)}requestAnimationFrame(loop)})(0);
function spinTo(seg,dur){
  const n=S.layout.length,st=2*Math.PI/n,TAU=2*Math.PI,base=-((seg+.5)*st)+(Math.random()-.5)*st*.6,from=S.rot;
  const d=(((base-from)%TAU)+TAU)%TAU,to=from+d+TAU*6,t0=performance.now();let lastTick=0;
  (function f(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);S.rot=from+(to-from)*e;
    const k=Math.floor(S.rot/st);if(k!==lastTick&&p<.95){lastTick=k;beep(900,.02,.015)}if(p<1)requestAnimationFrame(f);else{const r=S.st&&S.st.result;if(r){S.winSeg=r.seg;const rb=$('rb');rb.textContent=resLabel(r.spot,r.mega);paintRB(rb,r.spot);rb.classList.add('show')}}})(t0);
}
function setRot(seg){S.rot=-((seg+.5)*(2*Math.PI/S.layout.length));draw()}

/* bet ui */
function renderSpots(win){
  const open=S.st&&S.st.phase==='betting';
  $('spots').innerHTML=S.spots.map(s=>{const b=S.bets[s.id]||0,c=colorOf(s.id);
    return `<button class="spot ${b?'mine':''} ${win===s.id?'win':''}" style="--c:${c}" data-id="${s.id}" ${open?'':'disabled'}>${s.label}<small>${b?money(b):(s.m?s.m+'x রিটার্ন':'৩x–৪০x')}</small></button>`}).join('');
  $('spots').className='spots'+(S.spots.length===5?' five':'');
  $('clr').disabled=!open;const ab=$('allBtn');if(ab)ab.disabled=!open;
  $('spots').querySelectorAll('.spot').forEach(b=>b.onclick=()=>{beep(660,.05,.04);ws.send(JSON.stringify({t:'bet',spot:b.dataset.id,amount:S.chip,key:bkey()}))});
  $('clr').onclick=()=>ws.send(JSON.stringify({t:'clear'}));
}
function totalBet(){return Object.values(S.bets).reduce((a,b)=>a+(+b||0),0)}
function renderMsg(){
  const m=S.st;if(!m)return;let h;
  if(m.phase==='paused')h='গেম সাময়িক বন্ধ';
  else if(m.phase==='result'&&S.res&&S.res.round==m.roundId)h=S.res.win>0?'জিতেছেন <b class="w">'+money(S.res.win)+'</b>':'হেরেছেন <b class="l">'+money(S.res.stake)+'</b>';
  else{const tb=totalBet();h=tb>0?'মোট বেট <b>'+money(tb)+'</b>':(m.phase==='betting'?'বেট ধরুন':m.phase==='spin'?'হুইল ঘুরছে...':'ফলাফল')}
  $('msg').innerHTML=h;
}
function floatAt(id,d,i){
  const b=document.querySelector('.spot[data-id="'+id+'"]');if(!b)return;
  const r=b.getBoundingClientRect(),e=document.createElement('div');
  e.className='fl';e.textContent='+'+money(d);e.style.setProperty('--c',colorOf(id));
  e.style.left=(r.left+r.width/2)+'px';e.style.top=(r.top+r.height*.2)+'px';e.style.animationDelay=(i*80)+'ms';
  document.body.appendChild(e);setTimeout(()=>e.remove(),1500+i*80);
}
function betAll(){
  if(!(S.st&&S.st.phase==='betting'))return toast('বেটিং বন্ধ আছে');
  const a=S.chip,n=S.spots.length;if(!a||!n)return;
  if((S.bal||0)<a*n)return toast('ব্যালেন্স যথেষ্ট নয়');
  beep(660,.05,.04);
  S.spots.forEach((s,i)=>setTimeout(()=>ws.send(JSON.stringify({t:'bet',spot:s.id,amount:a,key:bkey()})),i*40));
}
function renderChips(){
  const open=S.st&&S.st.phase==='betting';
  $('chips').innerHTML=CHIPS.map(v=>`<button class="chip ${v===S.chip?'on':''}" style="--c:${CHIPCOL[v]}" data-v="${v}">${v}</button>`).join('')+`<button class="chip chip-all" id="allBtn" style="--c:#d97706" ${open?'':'disabled'}>ALL</button>`;
  $('chips').querySelectorAll('.chip:not(.chip-all)').forEach(b=>b.onclick=()=>{S.chip=+b.dataset.v;renderChips()});
  $('allBtn').onclick=betAll;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function maskName(n){n=String(n||'');if(n.includes('*'))return n;return n.length<=3?n.slice(0,1)+'***':n.slice(0,2)+'***'+n.slice(-1)}
function showFeed(L){const f=$('wfeed');if(!f)return;f.innerHTML='';const rows=[];
  if(S.res&&S.st&&S.res.round==S.st.roundId&&S.res.win>0)rows.push('<div class="wf me">🎉 আপনি জিতেছেন <b>'+money(S.res.win)+'</b></div>');
  (L||[]).slice(0,10).forEach(x=>rows.push('<div class="wf">🏆 <span class="wn">'+esc(maskName(x.name))+'</span> <b>'+Number(x.win).toLocaleString('en-US')+' tk</b></div>'));
  rows.forEach((h,i)=>{const t=document.createElement('div');t.innerHTML=h;const e=t.firstChild;e.style.animationDelay=(i*350)+'ms';f.appendChild(e)});
  clearTimeout(S.wt);S.wt=setTimeout(()=>{f.innerHTML=''},rows.length*350+3600)}
function renderHist(){
  const h=(S.st&&S.st.history)||[];
  $('hist').innerHTML=h.length?h.map(r=>`<span class="pill ${PILL[r.spot]||''}">${r.spot==='mega'?'★'+r.mega+'x':labelOf(r.spot)}</span>`).join(''):'<span class="pill pill-low" style="opacity:.5">নতুন রাউন্ড শুরু হচ্ছে</span>';
}
function renderTable(){
  if(S.tab==='bets'){
    $('thead').innerHTML='<span>রাউন্ড</span><span style="text-align:right">বেট (৳)</span><span style="text-align:center">X</span><span style="text-align:right">জয় (৳)</span>';
    const cur=Object.entries(S.bets).filter(([,v])=>v>0).map(([k,v])=>`<div class="bet-row user-row"><span>চলতি</span><span style="text-align:right">${money(v)}</span><span style="text-align:center">${labelOf(k)}</span><span style="text-align:right">...</span></div>`).join('');
    const log=S.log.map(l=>`<div class="bet-row ${l.win>0?'won-row':''}"><span>#${l.id}</span><span style="text-align:right">${money(l.stake)}</span><span style="text-align:center">${resLabel(l.spot,l.mega)}</span><span style="text-align:right;color:${l.win>0?'#10b981':'#64748b'}">${l.win>0?money(l.win):'0'}</span></div>`).join('');
    $('tableRows').innerHTML=(cur+log)||'<div class="empty">এখনো কোনো বেট নেই</div>';
  }
}
function tick(){
  const s=S.st;if(!s||!s.endsAt)return;
  const left=Math.max(0,s.endsAt-(Date.now()+S.off)),tot={betting:10000,spin:8000,result:5000}[s.phase]||1;
  {const c=Math.ceil(left/1000);$('tm').textContent=(s.phase==='betting'&&c>=1&&c<=10)?c:''}$('bar').style.width=(left/tot*100)+'%';
}
setInterval(tick,200);

function onState(m){const ab=document.querySelector('.arena-box');if(ab){ab.classList.toggle('ct-zoom',m.phase==='spin');ab.classList.toggle('ct-compact',m.phase==='betting'||m.phase==='result'||m.phase==='paused')}
  
  S.off=m.now-Date.now();S.st=m;S.winSeg=(m.phase==='result'&&m.result)?m.result.seg:null;const rb=$('rb');if(m.phase==='result'&&m.result){rb.textContent=resLabel(m.result.spot,m.result.mega);paintRB(rb,m.result.spot);rb.classList.add('show')}else rb.classList.remove('show');
  $('ph').textContent={betting:'বেট ধরুন',spin:'ঘুরছে',result:'ফলাফল',paused:'বিরতি'}[m.phase]||'';
  $('online').textContent='👥 '+(m.online||0);
  $('limits').textContent=m.cfg?`${money(m.cfg.minBet)} – ${money(m.cfg.maxBet)}`:'';
  if(m.phase==='betting'&&m.roundId!==S.lastRound){S.bets={};S.lastRound=m.roundId}
  if(m.phase==='spin'&&m.result&&S.spun!==m.roundId){S.spun=m.roundId;spinTo(m.result.seg,Math.max(1200,m.endsAt-(Date.now()+S.off)-300))}
  if(m.phase==='result'&&m.result){if(S.spun!==m.roundId){S.spun=m.roundId;setRot(m.result.seg)}renderSpots(m.result.spot)}else renderSpots();
  renderHist();renderTable();renderMsg();
}
function handle(m){
  if(m.t==='hello'){S.layout=m.layout;S.spots=m.spots;S.bets=m.bets||{};draw();renderSpots();renderTable()}
  else if(m.t==='state')onState(m);
  else if(m.t==='bal'){S.bal=m.balance;$('headerBalance').textContent=money2(m.balance)}
  else if(m.t==='bets'){const old=S.bets||{};S.bets=m.bets;renderSpots();renderTable();renderMsg();let i=0;for(const id in m.bets){const d=(m.bets[id]||0)-(old[id]||0);if(d>0)floatAt(id,d,i++)}}
  else if(m.t==='err'){toast(m.msg);beep(200,.15,.05)}
  else if(m.t==='settle'){
    if(m.stake>0){S.res={round:m.roundId,stake:m.stake,win:m.win};renderMsg();S.log.unshift({id:m.roundId,stake:m.stake,win:m.win,spot:m.spot,mega:m.mega});S.log=S.log.slice(0,30);renderTable();
      if(m.win>=MIN_WIN_POP)winPop(m.win);else if(m.win>0){}else toast(`এই রাউন্ডে হেরেছেন ${money(m.stake)}`)}}
  else if(m.t==='winners'){S.winners=(m.list||[]).slice(0,20);showFeed(S.winners)}
  else if(m.t==='fatal'){const f=$('fatal');f.textContent=m.msg;f.style.display='flex'}
}
const bkey=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).slice(0,40);
function connect(){
  ws=new WebSocket(window.CT_WS_URL||((location.protocol==='https:'?'wss://':'ws://')+location.host));
  ws.onopen=()=>ws.send(JSON.stringify({t:'auth',token}));
  ws.onclose=()=>{if($('fatal').style.display!=='flex')setTimeout(connect,2000)};
  ws.onmessage=e=>handle(JSON.parse(e.data));
}

/* demo: fake server in the browser (?demo) */
function demoServer(){
  const SP=[{id:'x2',label:'2x',m:2,slots:4750,segs:9},{id:'x5',label:'5x',m:5,slots:1900,segs:5},{id:'x10',label:'10x',m:10,slots:950,segs:3},{id:'x20',label:'20x',m:20,slots:475,segs:2},{id:'x50',label:'50x',m:50,slots:190,segs:1},{id:'mega',label:'MEGA',m:null,slots:1735,segs:4}];
  const MEGA=[[3,456],[5,280],[8,197],[15,62],[40,5]];
  const keys=[];SP.forEach((s,si)=>{for(let k=0;k<s.segs;k++)keys.push({id:s.id,key:(k+.5)/s.segs+si*1e-6})});
  keys.sort((a,b)=>a.key-b.key);const layout=keys.map(k=>k.id);
  let online=0,target=0,bal=5000,bets={},rid=100,phase='betting',endsAt=0,result=null,hist=[];
  const state=()=>({t:'state',phase,roundId:rid,endsAt,now:Date.now(),online,cfg:{minBet:10,maxBet:5000},history:hist,result:phase!=='betting'?{seg:result.seg,spot:result.spot,mega:result.mega}:undefined});
  function demoWinners(){const L='abcdefghijklmnopqrstuvwxyz',A=[1,2,3,4,10,50,100,250,300,500],r=n=>Math.floor(Math.random()*n);return Array.from({length:10},()=>({name:L[r(26)]+L[r(26)]+'***'+r(10),win:A[r(A.length)]}))}
  function pick(){let x=Math.floor(Math.random()*10000),a=0,spot='mega';for(const s of SP){a+=s.slots;if(x<a){spot=s.id;break}}
    let mega=null;if(spot==='mega'){const y=Math.floor(Math.random()*1000);let b=0;for(const [m,w] of MEGA){b+=w;if(y<b){mega=m;break}}}
    const idx=layout.map((id,i)=>id===spot?i:-1).filter(i=>i>=0);return{spot,mega,seg:idx[Math.floor(Math.random()*idx.length)]}}
  function round(){
    rid++;bets={};online=1;target=150+Math.floor(Math.random()*111);phase='betting';endsAt=Date.now()+10000;handle({t:'bets',bets:{}});handle(state());
    setTimeout(()=>{result=pick();phase='spin';endsAt=Date.now()+8000;handle(state());
      setTimeout(()=>{const st=Object.values(bets).reduce((a,b)=>a+b,0);
        const win=result.spot==='mega'?(bets.mega||0)*result.mega:(bets[result.spot]||0)*SP.find(s=>s.id===result.spot).m;
        bal+=win;handle({t:'bal',balance:bal});handle({t:'settle',roundId:rid,stake:st,win,spot:result.spot,mega:result.mega});
        hist=[{id:rid,spot:result.spot,mega:result.mega},...hist].slice(0,20);
        phase='result';endsAt=Date.now()+5000;handle(state());handle({t:'winners',list:demoWinners()});setTimeout(round,5000)},8000)},10000)}
  ws={send(raw){const m=JSON.parse(raw);
    if(m.t==='bet'){if(phase!=='betting')return handle({t:'err',msg:'বেটিং বন্ধ আছে'});if(bal<m.amount)return handle({t:'err',msg:'ব্যালেন্স যথেষ্ট নয়'});
      bal-=m.amount;bets[m.spot]=(bets[m.spot]||0)+m.amount;handle({t:'bal',balance:bal});handle({t:'bets',bets:{...bets}})}
    if(m.t==='clear'&&phase==='betting'){bal+=Object.values(bets).reduce((a,b)=>a+b,0);bets={};handle({t:'bal',balance:bal});handle({t:'bets',bets:{}})}}};
  setInterval(()=>{if(phase!=='betting')return;const p=1-Math.max(0,endsAt-Date.now())/10000,want=Math.round(1+(target-1)*p*(.92+Math.random()*.16));online=Math.max(online,Math.min(target,want));$('online').textContent='👥 '+online},400);
  handle({t:'hello',layout,spots:SP.map(s=>({id:s.id,label:s.label,m:s.m,slots:s.slots})),bets:{}});
  handle({t:'bal',balance:bal});round();
}
(function(){const sl=document.querySelectorAll('.promo .sl'),dt=document.querySelectorAll('.promo .dots i');let k=0;function go(n){k=n%sl.length;sl.forEach((e,i)=>e.classList.toggle('on',i===k));dt.forEach((e,i)=>e.classList.toggle('on',i===k))}go(0);setInterval(()=>go(k+1),3500)})();
/* CT fit: real visible height (old WebViews have no dvh) + wheel size from the space left */
function ctFit(){try{const w=document.querySelector('.app-wrapper'),a=document.querySelector('.arena-box'),ih=window.innerHeight,iw=window.innerWidth;
  w.style.height=((iw>=480&&ih>520)?Math.min(ih,900):ih)+'px';w.style.maxHeight=ih+'px';
  const cs=getComputedStyle(a),pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0),land=document.querySelector('.panels-container').getBoundingClientRect().left>10&&iw>ih;
  const availH=a.clientHeight-pad,availW=a.clientWidth-24,s=Math.floor(Math.max(70,Math.min(availH,availW,420))/1.14);
  a.style.setProperty('--stg',s+'px')}catch(e){}}
window.addEventListener('resize',ctFit);window.addEventListener('orientationchange',()=>setTimeout(ctFit,250));
if(window.ResizeObserver){try{new ResizeObserver(ctFit).observe(document.querySelector('.arena-box'))}catch(e){}}
setTimeout(ctFit,0);setTimeout(ctFit,600);
renderChips();renderHist();renderTable();
if(DEMO)demoServer();
else if(!token){$('fatal').textContent='লগইন টোকেন নেই। ইউজার প্যানেল থেকে Play Now চাপুন।';$('fatal').style.display='flex'}
else connect();
</script>
